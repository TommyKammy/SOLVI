# SOLVI SLOアラート (WP-P2-SLO-008 / NFR-OPS-001)
#
# 収録の基準は1つだけ: **鳴ったら人が何かをする**こと。
#
# 「知っておくと良い」程度のものを入れると、鳴っても誰も動かなくなる。
# その状態が続くと、本当に動くべきアラートも見過ごされる。
# アラートの敵は見逃しではなくノイズである。
#
# 参考にした値の出どころ: docs/ops/slo.md
# メトリクス名は実際の /metrics 出力で確認済み(推測ではない)。

groups:
  # ---------------------------------------------------------------------------
  # 可用性・レイテンシ (SLO本体)
  # ---------------------------------------------------------------------------
  - name: solvi-slo
    interval: 30s
    rules:
      # エラーバジェットの燃焼速度で判定する。
      # 「エラー率1%超で即通知」だと、一瞬の失敗でも夜中に人が起きる。
      # 逆に月次の集計だけを見ると、気付いたときには使い切っている。
      # 短窓と長窓の両方が閾値を超えたときだけ鳴らすと、
      # 一過性の揺れでは鳴らず、継続的な悪化では確実に鳴る。
      - alert: SolviErrorBudgetBurnFast
        # 14.4倍の燃焼 = 30日ぶんのバジェットを約2日で使い切る速度
        expr: |
          (
            sum(rate(solvi_http_requests_total{http_status_class="5xx"}[5m]))
            / sum(rate(solvi_http_requests_total[5m]))
          ) > (14.4 * 0.01)
          and
          (
            sum(rate(solvi_http_requests_total{http_status_class="5xx"}[1h]))
            / sum(rate(solvi_http_requests_total[1h]))
          ) > (14.4 * 0.01)
        for: 2m
        labels:
          severity: page
          slo: availability
        annotations:
          summary: 'エラーバジェットを高速に消費しています'
          description: >-
            直近5分と1時間の両方で5xx率がSLO目標(1%)の14.4倍を超えています。
            この速度が続くと約2日で月間バジェットを使い切ります。
            まず影響範囲(どのルートか)を確認してください。
          runbook: 'docs/ops/slo.md#エラーバジェットの燃焼'

      - alert: SolviErrorBudgetBurnSlow
        # 6倍の燃焼 = 約5日で使い切る速度。営業時間内対応で足りる。
        expr: |
          (
            sum(rate(solvi_http_requests_total{http_status_class="5xx"}[30m]))
            / sum(rate(solvi_http_requests_total[30m]))
          ) > (6 * 0.01)
          and
          (
            sum(rate(solvi_http_requests_total{http_status_class="5xx"}[6h]))
            / sum(rate(solvi_http_requests_total[6h]))
          ) > (6 * 0.01)
        for: 15m
        labels:
          severity: ticket
          slo: availability
        annotations:
          summary: 'エラーバジェットの消費が目標を上回っています'
          description: >-
            5xx率がSLO目標の6倍を超えた状態が続いています。
            即時対応は不要ですが、当日中に原因を特定してください。
          runbook: 'docs/ops/slo.md#エラーバジェットの燃焼'

      - alert: SolviLatencyP95Degraded
        # 主要画面 p95 1.5秒 (NFR-PERF-001)。
        # 単発の遅延では鳴らないよう10分の窓を取る。
        expr: |
          histogram_quantile(
            0.95,
            sum by (le) (rate(solvi_http_duration_bucket[10m]))
          ) > 1500
        for: 10m
        labels:
          severity: ticket
          slo: latency
        annotations:
          summary: 'レイテンシp95が目標(1.5秒)を超えています'
          description: >-
            10分間のp95が {{ $value | humanize }}ms です。
            遅いルートの特定は http_route 別の同じクエリで行えます。
          runbook: 'docs/ops/slo.md#レイテンシ'

  # ---------------------------------------------------------------------------
  # 非同期処理 — 画面は正常でも仕事が進んでいない状態を捕まえる
  # ---------------------------------------------------------------------------
  - name: solvi-async
    interval: 30s
    rules:
      # 通知やワークフローが止まっていても、画面は普通に動く。
      # 利用者からは「連絡が来ない」としか見えず、発見が遅れる。
      - alert: SolviOutboxLagHigh
        expr: |
          histogram_quantile(
            0.95,
            sum by (le) (rate(solvi_outbox_lag_bucket[10m]))
          ) > 30
        for: 10m
        labels:
          severity: ticket
          slo: async
        annotations:
          summary: 'Outbox配送の遅延がNFR-PERF-003(p95 30秒)を超えています'
          description: >-
            イベント発行から処理開始までのp95が {{ $value | humanize }}秒です。
            ディスパッチャの停止・DB負荷・特定イベントの詰まりを疑ってください。
          runbook: 'docs/ops/slo.md#outbox滞留'

      # 添付のスキャンが判定不能を返し続けている。
      #
      # **画面は正常に見えるが、添付が誰も開けない状態になる。**
      # ダウンロードURLは scan_status = 'clean' でなければ発行されないため、
      # スキャナが落ちると添付は溜まる一方になる。
      # 利用者からは「ファイルが壊れている」としか見えず、発見が遅れる。
      - alert: SolviAttachmentScanStalled
        expr: |
          sum(rate(solvi_attachment_scans_total{outcome="deferred"}[10m])) > 0
          and
          sum(rate(solvi_attachment_scans_total{outcome="clean"}[10m])) == 0
        for: 10m
        labels:
          severity: ticket
          slo: async
        annotations:
          summary: '添付のウイルススキャンが判定できていません'
          description: >-
            10分間、スキャンが判定不能のみを返しています。
            添付は保存されますが**誰も開けません**。
            ClamAV の稼働と署名DBの状態を確認してください。
          runbook: 'docs/ops/slo.md#添付スキャンの滞留'

      # ウイルス定義が古い。
      #
      # **これは「壊れている」ようには見えない。** スキャンは成功し、
      # clean が返り、ヘルスチェックも通る。古い定義で見逃しているだけである。
      # 検知できていないことは検知できないため、定義の古さを直接見る。
      #
      # 7日を閾値にしたのは、ClamAV の定義が日次で更新されるため。
      # 数日の遅れは許容し、週を跨いだら人が確認する。
      - alert: SolviScannerSignaturesStale
        # メトリクス名は実際の /metrics 出力に合わせる。
        # 単位は付かない(`_seconds` を足すと**永久に発火しない**)。
        expr: solvi_scanner_signature_age > 7 * 24 * 3600
        for: 30m
        labels:
          severity: ticket
          slo: security
        annotations:
          summary: 'ウイルス定義が古くなっています'
          description: >-
            スキャナが読み込んでいる定義が {{ $value | humanizeDuration }} 前のものです。
            **スキャンは成功し続けるため、見逃していることに気付けません。**
            freshclam の稼働と、clamd が新しい定義を読み直しているかを確認してください。
            ディスク上のファイルが新しくても、clamd が読み直していなければ古いままです。
          runbook: 'docs/ops/slo.md#ウイルス定義が古い'

  # ---------------------------------------------------------------------------
  # セキュリティ
  # ---------------------------------------------------------------------------
  - name: solvi-security
    interval: 30s
    rules:
      # 認可拒否の急増は、攻撃か権限設定の誤りのどちらか。
      # どちらであっても人が確認する必要がある。
      - alert: SolviAuthzDenialSpike
        expr: |
          sum(rate(solvi_authz_denials_total[5m])) > 1
        for: 5m
        labels:
          severity: ticket
          slo: security
        annotations:
          summary: '認可拒否が急増しています'
          description: >-
            毎秒 {{ $value | humanize }} 件の認可拒否が5分続いています。
            攻撃、あるいは権限設定の誤りによる正当な利用者の締め出しが考えられます。
            **どちらであっても利用者影響があります。** audit_event を確認してください。
          runbook: 'docs/ops/slo.md#認可拒否の急増'

  # ---------------------------------------------------------------------------
  # 監視基盤そのもの
  #
  # 「アラートが鳴らない = 正常」という誤解が最も危険。
  # 監視が死んでいることを監視する。
  # ---------------------------------------------------------------------------
  - name: solvi-meta
    interval: 30s
    rules:
      - alert: SolviTargetDown
        expr: up{job=~"solvi-.*"} == 0
        for: 2m
        labels:
          severity: page
          slo: availability
        annotations:
          summary: '{{ $labels.job }} からメトリクスを取得できません'
          description: >-
            スクレイプに失敗しています。プロセス停止、ポート閉塞、
            METRICS_PORT 未設定のいずれかです。
            **METRICS_PORT が未設定だとメトリクスは黙って捨てられます。**
          runbook: 'docs/ops/slo.md#メトリクスが取れない'

      - alert: SolviNoTraffic
        # 平日日中に一切のリクエストが無いのは、利用者が到達できていない可能性が高い。
        # 5xxが出ないまま完全に落ちる障害(LB/DNS/認証基盤)はこれでしか捕まらない。
        expr: |
          sum(rate(solvi_http_requests_total[15m])) == 0
        for: 15m
        labels:
          severity: ticket
          slo: availability
        annotations:
          summary: '15分間リクエストが1件もありません'
          description: >-
            エラー率は正常に見えても、利用者が到達できていない可能性があります
            (LB・DNS・認証基盤の障害)。合成監視の結果と併せて確認してください。
            パイロット期間は利用が少ないため、夜間・休日は誤検知になります。
            通知先の抑止時間帯を alertmanager.yml で調整してください。
          runbook: 'docs/ops/slo.md#トラフィックが無い'

  # ---------------------------------------------------------------------------
  # 合成監視 — 利用者から見た可用性
  # ---------------------------------------------------------------------------
  - name: solvi-synthetic
    interval: 60s
    rules:
      - alert: SolviSyntheticCheckFailing
        expr: solvi_synthetic_success == 0
        for: 3m
        labels:
          severity: page
          slo: availability
        annotations:
          summary: '合成監視 {{ $labels.check }} が失敗しています'
          description: >-
            外部から見た主要導線が使えていません。
            内部メトリクスが正常でも、利用者は業務を進められない状態です。
          runbook: 'docs/ops/slo.md#合成監視が失敗'

  # ---------------------------------------------------------------------------
  # 監査アンカー — 改ざん検知そのものの死活
  # ---------------------------------------------------------------------------
  - name: solvi-audit-anchor
    interval: 60s
    rules:
      - alert: SolviAuditAnchorMismatch
        expr: increase(solvi_audit_anchors_total{outcome="mismatch"}[1h]) > 0
        for: 0m
        labels:
          severity: page
        annotations:
          summary: '監査イベントが事後に改変された可能性があります'
          description: >-
            保存済みアンカーと現在の監査イベントの連鎖ハッシュが一致しません。
            アプリ経路からは UPDATE / DELETE できないため、
            DBへの直接操作かリストアの取り違えが疑われます。
            **調査が終わるまで該当期間の監査ログを証跡として扱わないでください。**
          runbook: 'docs/ops/slo.md#監査アンカーの不一致'

      # **何も鳴らないことを正常と読み替えないための警報である。**
      # アンカー処理は平時に何も出力しない。止まっていても画面もヘルスチェックも
      # 正常のままで、気付くのは監査を求められた時になる。
      # 1時間おきに実行しているので、3時間増えなければ止まっている。
      - alert: SolviAuditAnchorNotRunning
        expr: increase(solvi_audit_anchors_total[3h]) == 0 or absent(solvi_audit_anchors_total)
        for: 10m
        labels:
          severity: ticket
        annotations:
          summary: '監査アンカーが3時間以上実行されていません'
          description: >-
            改ざん検知が止まっています。止まっている間に改変されたイベントは
            **後からでは検知できません**(アンカーは上書きできないため、
            欠けた日を後から作っても意味がありません)。
            worker のログで audit anchor failed を確認してください。
          runbook: 'docs/ops/slo.md#監査アンカーが動いていない'
