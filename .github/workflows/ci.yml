name: CI

# 品質ゲート(WP-P1-CI-006 / Gate 1 G1-6)。
# AGENTS.md の規律を機械的に強制する。警告のみで通過するジョブを作らない。

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '22.12'

jobs:
  static:
    name: 静的検査
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Format
        run: npm run format:check
      - name: Typecheck
        run: npm run typecheck

  unit:
    name: 単体テスト
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run test:unit
      - name: skipされたテストの検出
        # 失敗するテストをskipしてゲートを通す行為を防ぐ(AGENTS.md §4)。
        # 意図的なskipは理由と再有効化期限をコード内に書き、この検査を更新すること。
        run: node tools/check_no_skipped_tests.mjs

  database:
    name: DB・認可・監査
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.6-alpine@sha256:1d04b9ba1d4996401f2552b51beda8187f175c0645c091e4781134fc9c9a3eef
        env:
          POSTGRES_DB: solvi
          POSTGRES_USER: solvi_owner
          POSTGRES_PASSWORD: ci-only-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U solvi_owner -d solvi"
          --health-interval 5s --health-timeout 3s --health-retries 20
      # 添付の検疫テスト(attachment-scan)が実スキャナを要求する。無いとスキップせず失敗させる設計。
      # docker-compose.yml の clamav と同じイメージ。署名DBの読込に時間がかかるため start-period を長く取る。
      clamav:
        image: clamav/clamav:1.4.3@sha256:75fb5fd95fcbe1d7e6d240c369c1572b686ee2c95949d1042b5148de8eddebb4
        ports: ['127.0.0.1:3310:3310']
        options: >-
          --health-cmd clamdcheck.sh
          --health-interval 15s --health-timeout 10s --health-retries 20
          --health-start-period 120s
    env:
      DATABASE_ADMIN_URL: postgres://solvi_owner:ci-only-password@localhost:5432/solvi
      DATABASE_URL: postgres://solvi_app:ci-only-password@localhost:5432/solvi
      POSTGRES_APP_PASSWORD: ci-only-password
      POSTGRES_EXECUTOR_PASSWORD: ci-only-password
      # オブジェクトストレージ(SeaweedFS、ADR-0028)。資格情報はこのジョブ内だけの使い捨て。
      S3_ENDPOINT: http://127.0.0.1:9100
      S3_REGION: ap-northeast-1
      S3_BUCKET_ATTACHMENTS: solvi-attachments
      S3_ACCESS_KEY: ci-only-access
      S3_SECRET_KEY: ci-only-secret-key
      CLAMAV_HOST: 127.0.0.1
      CLAMAV_PORT: '3310'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci

      - name: オブジェクトストレージ(SeaweedFS)の起動とバケット作成
        # ADR-0028: ローカル・CI の Object Storage は SeaweedFS(MinIO の OSS 版は配布終了)。
        # GitHub Actions の services では起動コマンドを渡せないため docker run で起動する。
        # 資格情報は環境変数で与える(SeaweedFS の S3 は設定ファイルが無いとき AWS_* を使う)。
        env:
          SEAWEEDFS_IMAGE: chrislusf/seaweedfs:4.52@sha256:57877e32bb90073b37dc109b438ba66e84fd5ed9ced5f5c04f56444ef243ce59
          AWS_ACCESS_KEY_ID: ci-only-access
          AWS_SECRET_ACCESS_KEY: ci-only-secret-key
          AWS_DEFAULT_REGION: ap-northeast-1
        run: |
          docker run -d --name seaweedfs -p 127.0.0.1:9100:8333 \
            -e AWS_ACCESS_KEY_ID -e AWS_SECRET_ACCESS_KEY \
            "$SEAWEEDFS_IMAGE" server -dir=/data -s3 -master.volumeSizeLimitMB=1024
          aws configure set default.s3.addressing_style path
          # 起動直後は S3 API が応答しないので、バケット作成が通るまで待つ
          for i in $(seq 1 30); do
            aws --endpoint-url "$S3_ENDPOINT" s3api head-bucket --bucket "$S3_BUCKET_ATTACHMENTS" 2>/dev/null && break
            aws --endpoint-url "$S3_ENDPOINT" s3 mb "s3://$S3_BUCKET_ATTACHMENTS" 2>/dev/null && break
            sleep 2
          done
          aws --endpoint-url "$S3_ENDPOINT" s3api head-bucket --bucket "$S3_BUCKET_ATTACHMENTS" \
            || { docker logs seaweedfs | tail -50; exit 1; }

      - name: マイグレーション適用
        run: npm run db:migrate
      - name: ロールのパスワード設定
        run: node tools/bootstrap_roles.mjs
      - name: 合成データ投入
        run: npm run db:seed

      - name: RLS設定と接続ロール権限の検査
        run: npm run check:rls

      - name: 越境・認可・監査テスト
        run: npm run test:security

      - name: マイグレーション down/up 往復
        # 巻き戻せないマイグレーションを本番へ持ち込まない
        run: |
          npm run db:rollback
          npm run db:migrate
          npm run db:status

  supply-chain:
    name: 供給網
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci

      - name: 依存の脆弱性(Critical/High で失敗)
        run: npm audit --audit-level=high

      - name: lockfile が最新であること
        # package.json だけ更新して lockfile を置き去りにすると、
        # CI と本番で違うバージョンが入る
        run: git diff --exit-code package-lock.json

      - name: コンテナイメージの digest 固定
        run: npm run check:images

      - name: Secret スキャン
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  architecture:
    name: アーキテクチャ境界
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: 禁止依存の検査
        # ADR-0001/0006/0007 の境界。壊れたら即座に落とす。
        run: npm run check:architecture
      - name: 計画文書とWPの整合
        run: npm run check:paths
      - name: AIサービスの境界
        run: |
          python3 -m pip install --quiet pytest
          python3 -m pytest services/ai-advisor/tests -q
