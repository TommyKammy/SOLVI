# ローカル開発スタック。
# イメージは digest 固定(AGENTS.md §1.14 / NFR-SEC-008)。tag だけの参照を追加しないこと。
# 検査: npm run check:images
name: solvi

services:
  postgres:
    image: postgres:16.6-alpine@sha256:1d04b9ba1d4996401f2552b51beda8187f175c0645c091e4781134fc9c9a3eef
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_SUPERUSER:?POSTGRES_SUPERUSER is required}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?POSTGRES_SUPERUSER_PASSWORD is required}
      # 決定的な照合順序。移行・検索の再現性のため固定する。
      POSTGRES_INITDB_ARGS: '--locale-provider=icu --icu-locale=ja-JP --encoding=UTF8'
    ports:
      - '${POSTGRES_PORT:-5433}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2024-11-07T00-52-20Z@sha256:ac591851803a79aee64bc37f66d77c56b0a4b6e12d9e5356380f4105510f2332
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?S3_ACCESS_KEY is required}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?S3_SECRET_KEY is required}
    ports:
      - '${S3_PORT:-9100}:9000'
      - '${S3_CONSOLE_PORT:-9101}:9001'
    volumes:
      - miniodata:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: Dockerfile.node
      target: dev
      args:
        SERVICE: api
    env_file: [.env]
    environment:
      NODE_ENV: development
      # コンテナ内からはサービス名で接続する(.env のホスト向け設定を上書き)
      DATABASE_URL: postgres://${POSTGRES_APP_USER}:${POSTGRES_APP_PASSWORD}@postgres:5432/${POSTGRES_DB}
      S3_ENDPOINT: http://minio:9000
    ports:
      - '${API_PORT:-3001}:3001'
    volumes:
      - ./services/api:/app/services/api
      - ./packages:/app/packages
      - /app/node_modules
    depends_on:
      postgres: { condition: service_healthy }
      minio: { condition: service_healthy }
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3001/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 30

  worker:
    build:
      context: .
      dockerfile: Dockerfile.node
      target: dev
      args:
        SERVICE: worker
    env_file: [.env]
    environment:
      NODE_ENV: development
      DATABASE_URL: postgres://${POSTGRES_APP_USER}:${POSTGRES_APP_PASSWORD}@postgres:5432/${POSTGRES_DB}
      S3_ENDPOINT: http://minio:9000
    ports:
      - '${WORKER_PORT:-3002}:3002'
    volumes:
      - ./services/worker:/app/services/worker
      - ./packages:/app/packages
      - /app/node_modules
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3002/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 30

  # SOLVI Run。ADR-0006 により Core とは別プロセス・別資格情報で動作する。
  # ローカルでも外部公開せず、内部ネットワークからのみ到達可能にする。
  executor:
    build:
      context: .
      dockerfile: Dockerfile.node
      target: dev
      args:
        SERVICE: executor
    env_file: [.env]
    environment:
      NODE_ENV: development
      DATABASE_URL: postgres://${POSTGRES_EXECUTOR_USER}:${POSTGRES_EXECUTOR_PASSWORD}@postgres:5432/${POSTGRES_DB}
    expose:
      - '3003'
    volumes:
      - ./services/executor:/app/services/executor
      - ./packages:/app/packages
      - /app/node_modules
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3003/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 30

  # SOLVI Assist。ADR-0007 により advisory-only。
  # DB接続も Executor への到達経路も持たせない(ネットワークを分離)。
  ai-advisor:
    build:
      context: services/ai-advisor
      dockerfile: Dockerfile
      target: dev
    environment:
      AI_ADVISOR_PORT: '3004'
      SOLVI_ENV: development
    ports:
      - '${AI_PORT:-3004}:3004'
    volumes:
      - ./services/ai-advisor:/app
    networks:
      - ai
    healthcheck:
      test:
        [
          'CMD',
          'python',
          '-c',
          "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:3004/healthz').status==200 else 1)",
        ]
      interval: 5s
      timeout: 3s
      retries: 30

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: dev
    env_file: [.env]
    environment:
      NODE_ENV: development
      API_BASE_URL: http://api:3001
    ports:
      - '${WEB_PORT:-3000}:3000'
    volumes:
      - ./apps/web:/app/apps/web
      - ./packages:/app/packages
      - /app/node_modules
      - /app/apps/web/.next
    depends_on:
      api: { condition: service_healthy }

volumes:
  pgdata:
  miniodata:

networks:
  # 既定ネットワーク(default)には ai-advisor を参加させない。
  # AI から Executor / DB へ到達する経路を作らない(AGENTS.md §1.3、脅威 T-13)。
  default:
  ai:
