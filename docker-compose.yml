# ローカル開発スタック。
# イメージは digest 固定(AGENTS.md §1.14 / NFR-SEC-008)。tag だけの参照を追加しないこと。
# 検査: npm run check:images
name: solvi

services:
  postgres:
    image: postgres:16.6-alpine@sha256:1d04b9ba1d4996401f2552b51beda8187f175c0645c091e4781134fc9c9a3eef
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_SUPERUSER:?POSTGRES_SUPERUSER is required}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?POSTGRES_SUPERUSER_PASSWORD is required}
      # 決定的な照合順序。移行・検索の再現性のため固定する。
      POSTGRES_INITDB_ARGS: '--locale-provider=icu --icu-locale=ja-JP --encoding=UTF8'
    ports:
      - '${POSTGRES_PORT:-5433}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2024-11-07T00-52-20Z@sha256:ac591851803a79aee64bc37f66d77c56b0a4b6e12d9e5356380f4105510f2332
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?S3_ACCESS_KEY is required}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?S3_SECRET_KEY is required}
    ports:
      - '${S3_PORT:-9100}:9000'
      - '${S3_CONSOLE_PORT:-9101}:9001'
    volumes:
      - miniodata:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: Dockerfile.node
      target: dev
      args:
        SERVICE: api
    env_file: [.env]
    environment:
      NODE_ENV: development
      # コンテナ内からはサービス名で接続する(.env のホスト向け設定を上書き)
      DATABASE_URL: postgres://${POSTGRES_APP_USER}:${POSTGRES_APP_PASSWORD}@postgres:5432/${POSTGRES_DB}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      METRICS_PORT: 9464
      # 検証段階のローカル認証を有効化する(ADR-0019)。
      # 本番構成(NODE_ENV=production)ではプロセスが起動を拒否する。
      AUTH_LOCAL_ENABLED: 'true'
      SESSION_COOKIE_SECURE: 'false'
      S3_ENDPOINT: http://minio:9000
    ports:
      - '${API_PORT:-3001}:3001'
      - '${API_METRICS_PORT:-9464}:9464'   # Prometheus スクレイプ
    volumes:
      - ./services/api:/app/services/api
      - ./packages:/app/packages
      - /app/node_modules
    depends_on:
      postgres: { condition: service_healthy }
      minio: { condition: service_healthy }
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3001/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 30

  worker:
    build:
      context: .
      dockerfile: Dockerfile.node
      target: dev
      args:
        SERVICE: worker
    env_file: [.env]
    environment:
      NODE_ENV: development
      DATABASE_URL: postgres://${POSTGRES_APP_USER}:${POSTGRES_APP_PASSWORD}@postgres:5432/${POSTGRES_DB}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      METRICS_PORT: 9464
      # 検証段階のローカル認証を有効化する(ADR-0019)。
      # 本番構成(NODE_ENV=production)ではプロセスが起動を拒否する。
      AUTH_LOCAL_ENABLED: 'true'
      SESSION_COOKIE_SECURE: 'false'
      S3_ENDPOINT: http://minio:9000
    ports:
      - '${WORKER_PORT:-3002}:3002'
    volumes:
      - ./services/worker:/app/services/worker
      - ./packages:/app/packages
      - /app/node_modules
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3002/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 30

  # SOLVI Run。ADR-0006 により Core とは別プロセス・別資格情報で動作する。
  # ローカルでも外部公開せず、内部ネットワークからのみ到達可能にする。
  executor:
    build:
      context: .
      dockerfile: Dockerfile.node
      target: dev
      args:
        SERVICE: executor
    env_file: [.env]
    environment:
      NODE_ENV: development
      DATABASE_URL: postgres://${POSTGRES_EXECUTOR_USER}:${POSTGRES_EXECUTOR_PASSWORD}@postgres:5432/${POSTGRES_DB}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      METRICS_PORT: 9464
    expose:
      - '3003'
    volumes:
      - ./services/executor:/app/services/executor
      - ./packages:/app/packages
      - /app/node_modules
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3003/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 30

  # SOLVI Assist。ADR-0007 により advisory-only。
  # DB接続も Executor への到達経路も持たせない(ネットワークを分離)。
  ai-advisor:
    build:
      context: services/ai-advisor
      dockerfile: Dockerfile
      target: dev
    environment:
      AI_ADVISOR_PORT: '3004'
      SOLVI_ENV: development
    ports:
      - '${AI_PORT:-3004}:3004'
    volumes:
      - ./services/ai-advisor:/app
    networks:
      - ai
    healthcheck:
      test:
        [
          'CMD',
          'python',
          '-c',
          "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:3004/healthz').status==200 else 1)",
        ]
      interval: 5s
      timeout: 3s
      retries: 30

  # ローカルのトレース可視化(WP-P1-OBS-005)。
  # 本番はマネージドのAPM/OTelコレクタへ送る。ここは開発用の確認手段。
  jaeger:
    image: jaegertracing/all-in-one:1.65.0@sha256:12fa17a231abded2c3b5b715bd252a043678495c588cbe772173991fbdcdf7c8
    environment:
      COLLECTOR_OTLP_ENABLED: 'true'
    ports:
      - '${JAEGER_UI_PORT:-16686}:16686'  # Web UI
      - '${OTLP_HTTP_PORT:-4318}:4318'    # OTLP/HTTP 受信
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://127.0.0.1:16686/']
      interval: 5s
      timeout: 3s
      retries: 20

  # ---------------------------------------------------------------------------
  # 監視 (WP-P2-SLO-008)
  #
  # Prometheus は pull 型。SOLVI 側が落ちていれば「スクレイプできない」こと
  # 自体が障害の証拠になる。push 型だと、送らなくなったのか送るものが無いのか
  # 区別できない。
  # ---------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v3.1.0@sha256:6559acbd5d770b15bb3c954629ce190ac3cbbdb2b7f1c30f0385c4e05104e218
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      # ローカル/パイロット規模の保持期間。SLOの月次判定に足りる長さにする。
      - '--storage.tsdb.retention.time=35d'
      - '--web.enable-lifecycle'
    volumes:
      - ./infra/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/monitoring/alerts:/etc/prometheus/alerts:ro
      - promdata:/prometheus
    ports:
      - '${PROMETHEUS_PORT:-9090}:9090'
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://127.0.0.1:9090/-/healthy']
      interval: 5s
      timeout: 3s
      retries: 20

  alertmanager:
    image: prom/alertmanager:v0.28.0@sha256:d5155cfac40a6d9250ffc97c19db2c5e190c7bc57c6b67125c94903358f8c7d8
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    volumes:
      - ./infra/monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanagerdata:/alertmanager
    ports:
      - '${ALERTMANAGER_PORT:-9093}:9093'
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://127.0.0.1:9093/-/healthy']
      interval: 5s
      timeout: 3s
      retries: 20

  # 合成監視 — 利用者と同じ経路で外から叩く (WP-P2-SLO-008)
  synthetic:
    image: node:22.12-alpine@sha256:51eff88af6dff26f59316b6e356188ffa2c422bd3c3b76f2556a2e7e89d080bd
    working_dir: /app
    command: ['node', 'tools/synthetic_check.mjs']
    environment:
      SYNTHETIC_API_BASE: http://api:3001
      SYNTHETIC_WEB_BASE: http://web:3000
      SYNTHETIC_PORT: 9465
      # 合成監視専用のアカウント。実在の利用者を使い回すと、
      # その人が無効化された瞬間に監視が落ちる(原因の特定にも時間がかかる)。
      # 未設定なら login / ticket_create は「未実行」として公開し、成功扱いにしない。
      SYNTHETIC_EMAIL: ${SYNTHETIC_EMAIL:-}
      SYNTHETIC_PASSWORD: ${SYNTHETIC_PASSWORD:-}
      SYNTHETIC_ORG: ${SYNTHETIC_ORG:-}
    volumes:
      - ./tools:/app/tools:ro
    depends_on:
      api: { condition: service_healthy }

  # アラート到達の証跡を残す受信先 (WP-P2-SLO-008)
  alert-sink:
    image: node:22.12-alpine@sha256:51eff88af6dff26f59316b6e356188ffa2c422bd3c3b76f2556a2e7e89d080bd
    working_dir: /app
    command: ['node', 'tools/alert_sink.mjs']
    environment:
      ALERT_SINK_PORT: 9466
      ALERT_SINK_LOG: /var/log/solvi/alerts.jsonl
    volumes:
      - ./tools:/app/tools:ro
      - alertlog:/var/log/solvi
    ports:
      - '${ALERT_SINK_PORT:-9466}:9466'

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: dev
    env_file: [.env]
    environment:
      NODE_ENV: development
      API_BASE_URL: http://api:3001
      WEB_BASE_URL: http://localhost:3000
      SESSION_COOKIE_SECURE: 'false'
    ports:
      - '${WEB_PORT:-3000}:3000'
    volumes:
      - ./apps/web:/app/apps/web
      - ./packages:/app/packages
      - /app/node_modules
      - /app/apps/web/.next
    depends_on:
      api: { condition: service_healthy }

volumes:
  pgdata:
  miniodata:
  promdata:
  alertmanagerdata:
  alertlog:

networks:
  # 既定ネットワーク(default)には ai-advisor を参加させない。
  # AI から Executor / DB へ到達する経路を作らない(AGENTS.md §1.3、脅威 T-13)。
  default:
  ai:
